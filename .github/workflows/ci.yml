name: DriveGuard CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  # Job 1: Backend quality checks (Ruff lint, pytest unit & contracts)
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Python syntax & compile check
        run: |
          python -c "import glob, py_compile; files = glob.glob('backend/**/*.py', recursive=True) + glob.glob('packages/**/*.py', recursive=True) + glob.glob('tests/**/*.py', recursive=True); [py_compile.compile(f, doraise=True) for f in files]; print(f'Compiled {len(files)} Python files successfully!')"
      - name: Lint & Format check (ruff)
        run: |
          pip install ruff
          ruff check backend/ packages/ tests/
      - name: Unit & Provider Contract Tests
        run: |
          pytest tests/unit/ tests/provider-contract/ -v

  # Job 2: Backend integration tests & PostGIS spatial regression suite
  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: driveguard
          POSTGRES_PASSWORD: driveguard
          POSTGRES_DB: driveguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run Alembic DB Migrations
        run: |
          cd backend && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://driveguard:driveguard@localhost:5432/driveguard_test
      - name: PostGIS Metric Geography Regression Suite
        run: |
          pytest tests/integration/test_geospatial.py -v
        env:
          DATABASE_URL: postgresql+asyncpg://driveguard:driveguard@localhost:5432/driveguard_test
          REDIS_URL: redis://localhost:6379/0
      - name: Mumbai Golden Routes & E2E & Simulation Suite
        run: |
          pytest tests/golden-routes/ tests/e2e/ tests/simulation/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://driveguard:driveguard@localhost:5432/driveguard_test
          REDIS_URL: redis://localhost:6379/0

  # Job 3: Admin Next.js Dashboard Build
  admin-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd apps/admin && npm ci
      - name: Build Next.js Admin
        run: cd apps/admin && npm run build

  # Job 4: Flutter Mobile Build & Artifact Creation
  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Get dependencies
        run: cd apps/mobile && flutter pub get
      - name: Analyze Flutter code
        run: cd apps/mobile && flutter analyze
      - name: Run Flutter tests
        run: cd apps/mobile && flutter test
      - name: Build Android APK
        run: cd apps/mobile && flutter build apk --debug
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driveguard-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

  # Job 5: Security & Secret Scanning
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # Job 6: Docker Container Build
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker Image
        run: docker build -t driveguard-api:latest -f backend/Dockerfile .
      - name: Build Admin Docker Image
        run: docker build -t driveguard-admin:latest -f apps/admin/Dockerfile apps/admin/

  # Job 7: Terraform Infrastructure Validation
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
      - name: Terraform Format Check
        run: cd infrastructure/terraform && terraform fmt -check
      - name: Terraform Init & Validate
        run: |
          cd infrastructure/terraform
          terraform init -backend=false
          terraform validate
