name: driveguard
description: DriveGuard - India-first navigation + traffic compliance platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  
  # Navigation
  go_router: ^14.2.0
  
  # Networking
  dio: ^5.5.0
  
  # Local Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  hive: ^4.0.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  
  # Location
  geolocator: ^12.0.0
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  # TTS
  flutter_tts: ^4.0.0
  
  # Haptics
  vibration: ^2.0.0
  
  # Permissions
  permission_handler: ^11.3.0
  
  # Image/file picking (for challan upload)
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  
  # JSON serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0
  
  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  connectivity_plus: ^6.0.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  
  # Analytics/Monitoring
  sentry_flutter: ^8.3.0
  
  # Deep links
  app_links: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.5.0
  riverpod_generator: ^2.4.0
  mockito: ^5.4.0
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
